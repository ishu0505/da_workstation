[package]
name = "da-workstation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gio = "=0.21.5"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
# GPUI 0.2.2 transitively uses xattr 0.2.3, which needs the removed Linux ENOATTR alias.
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[profile.dev]
debug = 1
